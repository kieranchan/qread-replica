<!DOCTYPE html>

<script>
/*
 * qyd-sdk.js — the page side of a 时光源 (轻悦时光 / qread web-page book source).
 *
 * A 时光源 is one HTML page that the app loads into a hidden web view. The app calls the page's global functions
 * (search / info / chapter / content / getfinds / find / getloginurl / login / gethelp / pay / filter / findfilter /
 * imagedecrypt / shouldOverrideUrlLoading / callbackjs) and the page talks back through
 * `window.flutter_inappwebview.callHandler(name, ...args)`. This file wraps every handler the app implements
 * (see docs/TIME_SOURCE.md) in the same class / method names that third-party sources already use
 * (FlutterJSBridge, Http, Cache, Cookie), and adds a few DOM / URL / model helpers under `QYD`.
 *
 * Usage (inline it in the page, before the source's own code):
 *   const flutterBridge = new FlutterJSBridge();   // reports `CookieJar` as soon as the bridge exists: the app waits for it
 *   const http = new Http(), cache = new Cache(), cookie = new Cookie();
 *   async function search(key, page) { ... return JSON.stringify([QYD.book({...})]); }
 *
 * Runs unchanged in the app (HeadlessInAppWebView), in the desktop runner (sources/runner) and in the original app.
 */
(function (global) {
  'use strict';

  function bridge() {
    return global.flutter_inappwebview;
  }

  /** Calls a handler; a missing bridge or a handler error rejects. */
  async function call(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    const b = bridge();
    if (!b || typeof b.callHandler !== 'function') throw new Error('flutter_inappwebview bridge missing: ' + name);
    return await b.callHandler.apply(b, [name].concat(args));
  }

  /** Calls a handler and answers [fallback] instead of throwing (the convention of the template pages). */
  async function safe(name, fallback) {
    const args = Array.prototype.slice.call(arguments, 2);
    try {
      return await call.apply(null, [name].concat(args));
    } catch (e) {
      return fallback;
    }
  }

  function headersJson(h) {
    if (h == null) return '{}';
    return typeof h === 'string' ? h : JSON.stringify(h);
  }

  class FlutterJSBridge {
    /**
     * @param {{isCookieJar?: boolean, autoReady?: boolean}} [opts] isCookieJar: let the app keep the cookies of the page's
     *   http requests (default true). autoReady false: the page calls ready() itself (front web views must NOT report ready).
     */
    constructor(opts) {
      opts = opts || {};
      this.isCookieJar = opts.isCookieJar !== false;
      this.isReady = false;
      if (opts.autoReady !== false) this.init();
    }

    init() {
      const self = this;
      if (bridge()) {
        self.ready();
      } else {
        global.addEventListener('flutterInAppWebViewPlatformReady', function () {
          self.ready();
        });
      }
    }

    /** `CookieJar(isCookieJar)`: tells the app the page is loaded; until then every call of the app waits (60 s). */
    async ready() {
      this.isReady = true;
      try {
        await call('CookieJar', this.isCookieJar);
      } catch (e) {
        console.error('CookieJar failed:', e);
      }
    }

    /** Reloads the discovery page (drops its cached entries when it is not open). */
    refreshExplore() {
      return safe('refreshExplore', '');
    }

    /** Replaces the stored html of this source (在线版地址更新) and restarts the page. */
    setHtml(html) {
      return safe('setHtml', null, String(html));
    }

    getbuildNumber() {
      return safe('buildNumber', 0);
    }

    getversion() {
      return safe('version', '0.0.0');
    }

    toTraditional(str) {
      return safe('toTraditional', '', String(str));
    }

    toSimplified(str) {
      return safe('toSimplified', '', String(str));
    }

    /** The device id the app sends as `deviceid` (stable per installation). */
    getDeviceid() {
      return safe('id', '');
    }

    /** windows | macos | ios | ohos | android */
    getDevice() {
      return safe('device', '');
    }

    /** The user name of the app account ('' when not logged in). */
    getLoginUser() {
      return safe('getLoginUser', '');
    }

    /** A line of the source debugger / app log. */
    log(str) {
      return safe('log', false, String(str));
    }

    /** Debugger html: type 0 search, 1 detail, 2 toc, 3 content. */
    text(type, str) {
      return safe('text', false, Number(type) || 0, String(str));
    }

    showToast(str) {
      return safe('showToast', false, String(str));
    }

    showLongToast(str) {
      return safe('showLongToast', false, String(str));
    }

    getWebViewUA() {
      return safe('getWebViewUA', '');
    }

    openurl(url) {
      return safe('openurl', false, String(url), '');
    }

    openurlwithMimeType(url, mimeType) {
      return safe('openurl', false, String(url), String(mimeType || ''));
    }

    /**
     * Background web view: loads `html` (with `url` as its address) or `url` (a POST when `body` is given, then put the
     * Content-Type in `header`), waits until the page is quiet and answers the value of `js` (the page source when empty).
     * `header` is a JSON string or an object.
     */
    webview(url, js, html, body, header) {
      return safe('webview', '', String(url || ''), String(js || ''), String(html || ''), String(body || ''), headersJson(header), '', '');
    }

    /** Like webview(), but answers the first navigation url matching `overrideUrlRegex` (the js value / source when none). */
    webViewGetOverrideUrl(url, js, html, body, header, overrideUrlRegex) {
      return safe('webview', '', String(url || ''), String(js || ''), String(html || ''), String(body || ''), headersJson(header), String(overrideUrlRegex || ''), '');
    }

    /** Like webview(), but answers the first loaded resource / navigation url matching `urlregex`. */
    webViewGetSource(url, js, html, body, header, urlregex) {
      return safe('webview', '', String(url || ''), String(js || ''), String(html || ''), String(body || ''), headersJson(header), '', String(urlregex || ''));
    }

    /** Like webview(), but answers the response text of the first XMLHttpRequest whose url matches `ajaxregex`. */
    webViewGetAjax(url, html, body, header, ajaxregex) {
      return safe('webviewajax', '', String(url || ''), String(html || ''), String(body || ''), headersJson(header), String(ajaxregex || ''));
    }

    /** Front web view (manual captcha / login); answers the page html when the user closes it. */
    startBrowser(url, title, header) {
      return safe('startBrowser', '', String(url), String(title || ''), headersJson(header));
    }

    /** Front web view that asks the page's `shouldOverrideUrlLoading(url)` before every navigation. */
    startBrowserWithShouldOverrideUrlLoading(url, title, header) {
      return safe('startBrowserWithShouldOverrideUrlLoading', '', String(url), String(title || ''), headersJson(header));
    }

    /** Half-height sheet (段评 / comments). */
    startBrowserDp(url, title) {
      return safe('startBrowserDp', '', String(url), String(title || ''));
    }

    startBrowserDpWithShouldOverrideUrlLoading(url, title, header) {
      return safe('startBrowserDpWithShouldOverrideUrlLoading', '', String(url), String(title || ''), headersJson(header));
    }

    /** Half-height sheet showing `html` under the address `url`. */
    startBrowserDpwithHtml(url, html, title) {
      return safe('startBrowserDpwithHtml', '', String(url || ''), String(html || ''), String(title || ''));
    }

    /** Front web views only: closes the current page. */
    back() {
      return safe('back', false);
    }

    utf8ToGbkUrlEncoded(str) {
      return safe('utf8ToGbkUrlEncoded', '', String(str));
    }

    /** Shows the captcha image (`str` url, `header` JSON) and answers what the user typed ('' = plain input). */
    getVerificationCode(str, header) {
      return safe('getVerificationCode', '', String(str || ''), headersJson(header));
    }

    /** Opens the detail page of `book` (a book url of this source, or the JSON of a book). */
    addbook(book) {
      return safe('addbook', '', typeof book === 'string' ? book : JSON.stringify(book));
    }

    /** Runs a search in the app with this source. */
    searchbook(key) {
      return safe('searchbook', null, String(key));
    }

    base64encode(str) {
      return safe('base64encode', '', String(str));
    }

    base64decode(str) {
      return safe('base64decode', '', String(str));
    }

    htmlToText(html) {
      return safe('htmlToText', '', String(html));
    }

    /** Plays `url` in the app's video player (short dramas). */
    showvideoplay(url, title) {
      return safe('showvideoplay', null, String(url), String(title || ''));
    }

    /** Speaks `text` with the app's TTS. */
    voice(text) {
      return safe('voice', null, String(text));
    }

    /** The reader's current chapter index of `bookUrl`. */
    getdurChapterIndex(bookUrl) {
      return safe('getdurChapterIndex', 0, String(bookUrl));
    }

    /** Asks the reader to reload the current chapter. */
    refreshContent() {
      return safe('refreshContent', null);
    }
  }

  /**
   * HTTP through the app: every answer is `{method, data (decoded text), body (base64 bytes), headers {name: [values]},
   * statusCode, statusMessage}` or null when the bridge failed; a transport error gives statusCode 0 with the error in
   * statusMessage. `http2://` / `https2://` urls select HTTP/2 in the original app (plain https here).
   */
  class Http {
    Get(url, headers, followRedirects) {
      return safe('http', null, 'get', String(url), '', headersJson(headers), followRedirects !== false, '');
    }

    Head(url, headers, followRedirects) {
      return safe('http', null, 'head', String(url), '', headersJson(headers), followRedirects !== false, '');
    }

    /** `contenttype` wins over a Content-Type header; without both the app sends application/x-www-form-urlencoded. */
    Post(url, headers, body, contenttype, followRedirects) {
      return safe('http', null, 'post', String(url), body == null ? '' : typeof body === 'string' ? body : JSON.stringify(body), headersJson(headers), followRedirects !== false, String(contenttype || ''));
    }
  }

  /** Key/value store of this source (one text value per key; `null` when unset). */
  class Cache {
    get(key) {
      return safe('cache.get', null, String(key));
    }

    set(key, value) {
      return safe('cache.set', null, String(key), value == null ? '' : typeof value === 'string' ? value : JSON.stringify(value));
    }

    remove(key) {
      return safe('cache.remove', null, String(key));
    }

    /** The store shared by all sources. */
    allget(key) {
      return safe('cache.allget', null, String(key));
    }

    allset(key, value) {
      return safe('cache.allset', null, String(key), value == null ? '' : typeof value === 'string' ? value : JSON.stringify(value));
    }

    allremove(key) {
      return safe('cache.allremove', null, String(key));
    }

    /** The JSON text of the login dialog's fields (getloginurl() answered a form), '' / null before the first login. */
    getLoginInfo() {
      return this.get('LoginInfo');
    }

    putLoginInfo(info) {
      return this.set('LoginInfo', info);
    }

    /** The 书籍变量 the user typed for a book (keyed by its bookUrl). */
    getbookVariable(bookurl) {
      return this.get(String(bookurl));
    }

    setbookVariable(bookurl, value) {
      return this.set(String(bookurl), value);
    }
  }

  /** The app's cookie store, by url. */
  class Cookie {
    /** All cookies of the url's host as one `a=b; c=d` text. */
    get(url) {
      return safe('cookie.get', null, String(url));
    }

    remove(url) {
      return safe('cookie.remove', null, String(url));
    }

    /** Replaces the cookies of the url's host with `value` (`a=b; c=d`). */
    set(url, value) {
      return safe('cookie.set', null, String(url), String(value));
    }

    setCookie(url, key, value) {
      return safe('cookie.setcookie', null, String(url), String(key), String(value));
    }

    /** One cookie value, null when absent. */
    getCookie(url, key) {
      return safe('cookie.getCookie', null, String(url), String(key));
    }
  }

  // ------------------------------------------------------------------ helpers (not part of the app's contract)

  /** Parses html into a Document (scripts never run). */
  function dom(html) {
    return new DOMParser().parseFromString(String(html || ''), 'text/html');
  }

  function q(root, selector) {
    return (root && root.querySelector) ? root.querySelector(selector) : null;
  }

  function qa(root, selector) {
    return (root && root.querySelectorAll) ? Array.prototype.slice.call(root.querySelectorAll(selector)) : [];
  }

  function text(el) {
    return el ? String(el.textContent || '').replace(/\s+/g, ' ').trim() : '';
  }

  function attr(el, name) {
    return el ? String(el.getAttribute(name) || '') : '';
  }

  /** Resolves `href` against `base` (absolute urls pass through). */
  function abs(base, href) {
    try {
      return new URL(String(href || ''), String(base || location.href)).href;
    } catch (e) {
      return String(href || '');
    }
  }

  /** Decodes json text (twice when the text holds a json string); `fallback` on failure. */
  function json(value, fallback) {
    let v = value;
    for (let i = 0; i < 2 && typeof v === 'string'; i++) {
      const t = v.trim();
      if (!t) return fallback;
      try {
        v = JSON.parse(t);
      } catch (e) {
        return i === 0 ? fallback : v;
      }
    }
    return v === undefined ? fallback : v;
  }

  /** Query-string encoding of an object. */
  function query(params) {
    return Object.keys(params || {}).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(params[k] == null ? '' : params[k]);
    }).join('&');
  }

  /** Strips the decorations many sites put around a title (《》 are kept). */
  function purifyTitle(title) {
    const t = String(title == null ? '' : title).trim();
    return t.replace(/^[^A-Za-z0-9一-龥()（）《》【】]+|[^A-Za-z0-9一-龥()（）《》【】]+$/g, '');
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /** `<p>` paragraphs out of plain text lines (what content() returns for a novel). */
  function paragraphs(textOrLines) {
    const lines = Array.isArray(textOrLines) ? textOrLines : String(textOrLines || '').split(/\r?\n/);
    return lines.map(function (l) {
      return l.replace(/^[\s　]+|\s+$/g, '');
    }).filter(Boolean).map(function (l) {
      return '<p>' + escapeHtml(l) + '</p>';
    }).join('\n');
  }

  /** Book type numbers of the app. */
  const TYPE = { novel: 0, audio: 1, comic: 2, drama: 4 };

  /** A book object with every field the app reads (search / find lists and info()). */
  function book(b) {
    b = b || {};
    return {
      bookUrl: String(b.bookUrl || ''),
      name: String(b.name || ''),
      author: String(b.author || ''),
      kind: Array.isArray(b.kind) ? b.kind.filter(Boolean).join(',') : String(b.kind || ''),
      coverUrl: String(b.coverUrl || ''),
      intro: String(b.intro || ''),
      tocUrl: String(b.tocUrl || b.bookUrl || ''),
      wordCount: String(b.wordCount == null ? '' : b.wordCount),
      type: Number(b.type) || 0,
      latestChapterTitle: String(b.latestChapterTitle || ''),
      downloadUrls: String(b.downloadUrls || ''),
    };
  }

  /** A chapter object (index is overwritten by the app with the position). */
  function chapter(c, index) {
    c = c || {};
    return {
      name: String(c.name || ''),
      chapterId: String(c.chapterId || c.url || ''),
      index: Number(index != null ? index : c.index) || 0,
      isPay: !!c.isPay,
      isVip: !!c.isVip,
      isVolume: !!c.isVolume,
      tag: String(c.tag || ''),
    };
  }

  /** The entries getfinds() answers (JSON array). width: 0 auto, 1 half, 2 two thirds, 3 full line. */
  const explore = {
    /** A list: `url` is given to find(url, page) (`{{page}}` is replaced by the page). */
    list: function (title, url, width) {
      return { title: String(title), url: String(url), width: Number(width) || 0 };
    },
    /** A page opened in the app's web view. */
    web: function (title, url, width) {
      return { title: String(title), url: String(url), width: Number(width) || 0, type: 1 };
    },
    /** A drop-down: the choice is stored with cache.set(title, value), then `action` (js) runs in the page. */
    select: function (title, chars, defaultValue, action, width) {
      return { title: String(title), type: 2, chars: chars.map(String), default: String(defaultValue == null ? '' : defaultValue), action: String(action || ''), width: Number(width) || 0 };
    },
    /** An input box, stored like a drop-down. */
    input: function (title, defaultValue, action, width) {
      return { title: String(title), type: 3, default: String(defaultValue == null ? '' : defaultValue), action: String(action || ''), width: Number(width) || 0 };
    },
    /** A button running `action` (js) in the page. */
    button: function (title, action, width) {
      return { title: String(title), type: 4, action: String(action || ''), width: Number(width) || 0 };
    },
    /** A full-width section title. */
    title: function (title) {
      return { title: String(title), url: '', width: 3 };
    },
  };

  /** Login dialog rows for getloginurl(): [{name, type: text|password|select|button, default, chars, action}]. */
  const loginForm = {
    text: function (name, defaultValue) {
      return { name: String(name), type: 'text', default: String(defaultValue == null ? '' : defaultValue) };
    },
    password: function (name) {
      return { name: String(name), type: 'password' };
    },
    select: function (name, chars, defaultValue) {
      return { name: String(name), type: 'select', chars: chars.map(String), default: String(defaultValue == null ? '' : defaultValue) };
    },
    button: function (name, action) {
      return { name: String(name), type: 'button', action: String(action || '') };
    },
  };

  /** `<img src="url,{json}">` with options the reader understands (js on tap, headers, imageDecode). */
  function image(url, opts) {
    return '<img src="' + String(url) + (opts ? ',' + JSON.stringify(opts) : '') + '"/>';
  }

  const QYD = {
    version: '1.0.0',
    call: call,
    safe: safe,
    FlutterJSBridge: FlutterJSBridge,
    Http: Http,
    Cache: Cache,
    Cookie: Cookie,
    dom: dom,
    q: q,
    qa: qa,
    text: text,
    attr: attr,
    abs: abs,
    json: json,
    query: query,
    purifyTitle: purifyTitle,
    escapeHtml: escapeHtml,
    paragraphs: paragraphs,
    TYPE: TYPE,
    book: book,
    chapter: chapter,
    explore: explore,
    loginForm: loginForm,
    image: image,
  };

  global.QYD = QYD;
  global.FlutterJSBridge = FlutterJSBridge;
  global.Http = Http;
  global.Cache = Cache;
  global.Cookie = Cookie;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/*
 * 路易斯聚合 — the 时光源 page of the owner's own aggregation platform (server/src/luis/). The wire protocol is the
 * one of sources/langge (search / detail / catalog / content / discovestyle / get_discover / sources/config /
 * get_avatar); the platform list and the tabs come from the backend, so new adapters appear here without a change.
 * Login: 发现页 → 「登录 / 账户」 opens {server}/login (the app keeps the cookies qttoken + deviceId).
 * Settings (source cache, discovery drop-downs): server, tab, source_type, explore_source, sources.
 */
'use strict';

const flutterBridge = new FlutterJSBridge();
const http = new Http();
const cache = new Cache();
const cookie = new Cookie();

const SERVERS = [{ url: 'https://qread.forfine.me/luis', name: '路易斯 主站' }];
const DEFAULT_SERVER = SERVERS[0].url;
const LOGIN_PATH = '/login?source_client=qyd';
const UA = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Mobile/15E148 qread-luis';
const DEFAULT_TABS = ['小说', '听书', '短剧', '漫画'];
const TYPE_OF_TAB = { '小说': 0, '听书': 1, '漫画': 2, '短剧': 4 };

const enc = encodeURIComponent;
const purify = QYD.purifyTitle;
const esc = QYD.escapeHtml;

function b64e(s) {
  const bytes = new TextEncoder().encode(String(s));
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function b64d(s) {
  try {
    const bin = atob(String(s).trim().replace(/-/g, '+').replace(/_/g, '/').replace(/[^A-Za-z0-9+/=]/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  } catch (e) {
    return '';
  }
}

function normServer(v) {
  return String(v || '').trim().replace(/\/+$/, '');
}

function isServer(v) {
  return /^https?:\/\/[^/?#]+/i.test(normServer(v));
}

function sourceName(v) {
  return String(v || '').replace(/^svip_/, '');
}

async function getServer() {
  const s = normServer(await cache.get('server'));
  return isServer(s) ? s : DEFAULT_SERVER;
}

async function allServers() {
  const list = SERVERS.map((s) => ({ ...s }));
  const add = (v) => {
    const url = normServer(v && typeof v === 'object' ? v.url : v);
    if (!isServer(url) || list.some((s) => s.url === url)) return;
    list.push({ url, name: (v && v.name) || '自定义' });
  };
  const custom = QYD.json(await cache.get('customServers'), []);
  if (Array.isArray(custom)) custom.forEach(add);
  add(await cache.get('server'));
  return list;
}

/** Login state: the cookies the platform's login page set, else what was cached. */
async function getToken() {
  const servers = [await getServer()].concat((await allServers()).map((s) => s.url));
  for (const s of servers) {
    const t = (await cookie.getCookie(s, 'qttoken')) || '';
    if (t) {
      const d = (await cookie.getCookie(s, 'deviceId')) || '';
      await cache.set('qttoken', t);
      if (d) await cache.set('deviceId', d);
      return { qttoken: t, deviceId: d };
    }
  }
  return { qttoken: (await cache.get('qttoken')) || '', deviceId: (await cache.get('deviceId')) || '' };
}

async function authHeaders() {
  const t = await getToken();
  const h = { 'User-Agent': UA };
  if (t.qttoken) h['Cookie'] = 'qttoken=' + t.qttoken + '; deviceId=' + t.deviceId + ';';
  return h;
}

function parseJson(resp) {
  if (!resp) return null;
  const d = resp.data;
  if (d && typeof d === 'object') return d;
  return QYD.json(d, null);
}

function unwrap(j) {
  if (j && typeof j === 'object' && !Array.isArray(j) && j.data !== undefined) return j.data;
  return j;
}

/** GET of one platform url, other servers tried on a transport failure; the raw text goes to the debugger. */
async function backendGet(url, debugType, opts) {
  opts = opts || {};
  const headers = await authHeaders();
  const cur = await getServer();
  const servers = [cur].concat((await allServers()).map((s) => s.url).filter((u) => u !== cur));
  const tries = opts.retry === false ? [cur] : servers;
  for (let i = 0; i < tries.length; i++) {
    const u = i === 0 ? url : url.replace(cur, tries[i]);
    let resp = null;
    try {
      resp = await http.Get(u, headers, true);
    } catch (e) {}
    const ok = resp && resp.statusCode >= 200 && resp.statusCode < 300 && resp.data != null && String(resp.data).length > 1;
    if (ok) {
      if (debugType != null) flutterBridge.text(debugType, String(resp.data).slice(0, 20000));
      if (i > 0) {
        await cache.set('server', tries[i]);
        flutterBridge.showToast('线路已切换到：' + tries[i]);
      }
      return parseJson(resp);
    }
    if (resp && resp.statusCode >= 400 && resp.statusCode < 500) {
      if (debugType != null) flutterBridge.text(debugType, String(resp.data || resp.statusMessage || ''));
      return parseJson(resp) || { code: -1, msg: 'HTTP ' + resp.statusCode };
    }
    flutterBridge.log('请求失败 ' + (resp ? resp.statusCode + ' ' + resp.statusMessage : 'null') + ': ' + u);
  }
  return null;
}

function toBook(server, b) {
  const src = sourceName(b.source);
  const tab = b.tab || '小说';
  const url = server + '/detail?book_id=' + b.book_id + '&source=' + enc(src) + '&tab=' + enc(tab);
  return QYD.book({
    bookUrl: url,
    tocUrl: url,
    name: purify(b.book_name),
    author: b.author,
    kind: [b.status, b.score && b.score !== '0' ? String(b.score).replace(/分$/, '') + '分' : '', b.tags || b.category, b.last_chapter_update_time],
    coverUrl: b.thumb_url,
    intro: b.abstract,
    wordCount: b.word_number,
    type: TYPE_OF_TAB[tab] || 0,
    latestChapterTitle: src + ':' + (b.latest_chapter_title || b.last_chapter_title || ''),
  });
}

function toBooks(server, j) {
  let list = unwrap(j);
  if (!Array.isArray(list)) list = [];
  return list.filter((b) => b && b.book_id).map((b) => toBook(server, b));
}

/** `/sources/config`, cached for an hour: platforms by tier and the tabs each one serves. */
async function sourcesConfig(server) {
  const cached = QYD.json(await cache.get('sources_config'), null);
  if (cached && cached.at && Date.now() - cached.at < 3600000 && cached.data) return cached.data;
  const j = await backendGet(server + '/sources/config', null, { retry: false });
  const d = unwrap(j);
  if (d && d.modes) {
    await cache.set('sources_config', JSON.stringify({ at: Date.now(), data: d }));
    return d;
  }
  return cached && cached.data ? cached.data : { free: [], vip: [], svip: [], modes: {} };
}

function platformsOf(config, tab) {
  const out = [];
  for (const name of Object.keys(config.modes || {})) if ((config.modes[name] || []).indexOf(tab) >= 0) out.push(name);
  return out;
}

function tabsOf(config) {
  const seen = {};
  for (const name of Object.keys(config.modes || {})) for (const t of config.modes[name] || []) seen[t] = true;
  const tabs = DEFAULT_TABS.filter((t) => seen[t]);
  return tabs.length ? tabs : ['小说'];
}

// ------------------------------------------------------------------ entry points

async function search(key, page, env) {
  const server = await getServer();
  const sources = (await cache.get('sources')) || '全部';
  const tab = (await cache.get('tab')) || '小说';
  const url = server + '/search?title=' + enc(key) + '&page=' + (Number(page) || 1) + '&source=' + enc(sources) + '&tab=' + enc(tab) + '&disabled_sources=0';
  const j = await backendGet(url, 0);
  if (!j) {
    flutterBridge.log('搜索失败：' + url);
    return '[]';
  }
  if (j.code !== undefined && j.code !== 0 && j.msg) {
    flutterBridge.showToast(String(j.msg));
    return '[]';
  }
  if (Array.isArray(j.disabled_sources) && j.disabled_sources.length && (Number(page) || 1) === 1 && !j.cache) {
    flutterBridge.log('未开通的平台：' + j.disabled_sources.join('、'));
  }
  return JSON.stringify(toBooks(server, j));
}

async function info(bookurl) {
  const server = await getServer();
  const j = await backendGet(bookurl, 1);
  const d = unwrap(j);
  if (!d || typeof d !== 'object' || !d.book_id) throw new Error('详情获取失败' + (j && j.msg ? '：' + j.msg : ''));
  d.source = sourceName(d.source);
  const tab = d.tab || '小说';
  const t = await getToken();
  let account = '未登录（发现页 → 登录 / 账户）';
  if (t.qttoken) {
    const u = parseJson(await http.Get(server + '/get_avatar', await authHeaders(), true));
    account = u && (u.nickname || u.email) ? esc(u.nickname || u.email) + '（已登录）' : '登录已失效，请重新登录';
  }
  const rows = [
    ['数据来源', d.source + ' · ' + tab],
    ['状态', d.status], ['评分', d.score && d.score !== '0' ? d.score : ''], ['字数', d.word_number],
    ['标签', d.tags || d.category], ['主角', d.role], ['最新章节', d.last_chapter_title || d.latest_chapter_title], ['更新时间', d.last_chapter_update_time],
    ['线路', server], ['账户', account],
  ].filter((r) => r[1]);
  let intro = '@html:<div style="font-size:14px;line-height:1.8;opacity:.92"><table style="border-collapse:collapse;width:100%">' +
    rows.map((r) => '<tr><td style="padding:2px 8px 2px 0;white-space:nowrap;opacity:.65">' + esc(r[0]) + '</td><td style="padding:2px 0">' + (r[0] === '账户' ? r[1] : esc(r[1])) + '</td></tr>').join('') +
    '</table>';
  if (d.abstract) intro += '<p style="margin:10px 0 0;text-indent:2em">' + esc(String(d.abstract)).replace(/\n+/g, '<br>') + '</p>';
  if (d.copyright_info) intro += '<p style="margin:8px 0 0;font-size:12px;opacity:.55">' + esc(String(d.copyright_info)) + '</p>';
  intro += '</div>';
  return JSON.stringify(QYD.book({
    bookUrl: bookurl,
    name: purify(d.book_name),
    author: d.author,
    kind: [d.status, d.score && d.score !== '0' ? d.score + '分' : '', d.tags || d.category, d.last_chapter_update_time],
    coverUrl: d.thumb_url,
    intro: intro,
    tocUrl: b64e(JSON.stringify({ book_id: d.book_id, source: d.source, tab: tab })),
    wordCount: d.word_number,
    type: TYPE_OF_TAB[tab] || 0,
    latestChapterTitle: d.last_chapter_title || d.latest_chapter_title || '',
  }));
}

async function chapter(tocUrl, bookurl) {
  const server = await getServer();
  const t = QYD.json(b64d(tocUrl), null);
  if (!t || !t.book_id) throw new Error('目录地址无效，请先打开详情页');
  const url = server + '/catalog?book_id=' + t.book_id + '&source=' + enc(sourceName(t.source)) + '&tab=' + enc(t.tab || '小说');
  const j = await backendGet(url, 2);
  const list = unwrap(j);
  if (!Array.isArray(list)) throw new Error('目录获取失败' + (j && j.msg ? '：' + j.msg : ''));
  return JSON.stringify(list.map((c, i) => QYD.chapter({
    name: c.title,
    chapterId: b64e(JSON.stringify({ item_id: c.item_id, source: sourceName(c.source || t.source), tab: c.tab || t.tab, book_id: t.book_id, chapter_title: c.title || '' })),
    isPay: !!c.is_pay,
    isVolume: !!c.is_volume,
  }, i)));
}

function normTitle(v) {
  return String(v || '').replace(/<[^>]*>/g, '').replace(/[\s　]+/g, '').toLowerCase();
}

function stripTitle(content, title) {
  const text = String(content || '');
  const want = normTitle(title);
  if (!want) return text;
  const m = text.match(/^\s*([^\n<]{1,120})\s*\n?/);
  if (m && normTitle(m[1]) === want) return text.slice(m[0].length);
  return text;
}

async function content(url, bookurl, index) {
  const server = await getServer();
  const c = QYD.json(b64d(url), null);
  if (!c || typeof c !== 'object' || !c.item_id) throw new Error('章节地址无效');
  c.source = sourceName(c.source);
  c.tab = c.tab || '小说';
  const u = server + '/content?item_id=' + enc(c.item_id) + '&source=' + enc(c.source) + '&tab=' + enc(c.tab) + '&version=5';
  const j = await backendGet(u, 3);
  if (!j || typeof j !== 'object') throw new Error('正文获取失败');
  if (Number(j.code) !== 0) throw new Error('正文获取失败' + (j.msg ? '：' + j.msg : ''));
  let result = j.content == null ? '' : String(j.content);
  if (c.tab === '听书' || c.tab === '短剧') return result.trim();
  if (c.tab === '小说') result = stripTitle(result, c.chapter_title || j.title || '');
  return result;
}

// ------------------------------------------------------------------ discovery

const FILTER_KEYS = { '线路': 'server', '类型': 'tab', '频道': 'source_type', '平台': 'explore_source', '搜索范围': 'sources' };

async function applyFilter(title) {
  const key = FILTER_KEYS[title];
  let v = await cache.get(title);
  if (!key || v == null || v === '') return;
  if (title === '线路') {
    v = normServer(v);
    if (!isServer(v)) return;
    await cache.remove('sources_config');
  }
  await cache.set(key, v);
  if (title === '类型') {
    const config = await sourcesConfig(await getServer());
    const valid = platformsOf(config, v);
    const cur = await cache.get('explore_source');
    if (cur && valid.indexOf(cur) < 0) await cache.set('explore_source', valid[0] || '');
  }
  await flutterBridge.refreshExplore();
}

async function getfinds() {
  const server = await getServer();
  if ((await cache.get('server')) !== server) await cache.set('server', server);
  const config = await sourcesConfig(server);
  const tabs = tabsOf(config);
  let tab = (await cache.get('tab')) || tabs[0];
  if (tabs.indexOf(tab) < 0) tab = tabs[0];
  const gender = (await cache.get('source_type')) || '男频';
  const platforms = platformsOf(config, tab);
  let platform = (await cache.get('explore_source')) || platforms[0] || '';
  if (platforms.indexOf(platform) < 0) platform = platforms[0] || '';
  const sources = (await cache.get('sources')) || '全部';
  const servers = (await allServers()).map((s) => s.url);
  const t = await getToken();
  const all = [].concat(config.free || [], config.vip || [], config.svip || []);

  const entries = [
    QYD.explore.select('线路', servers, server, "applyFilter('线路')"),
    QYD.explore.select('类型', tabs, tab, "applyFilter('类型')"),
    QYD.explore.select('频道', ['男频', '女频'], gender, "applyFilter('频道')"),
    QYD.explore.select('平台', platforms.length ? platforms : ['（无）'], platform || '（无）', "applyFilter('平台')"),
    QYD.explore.select('搜索范围', ['全部'].concat(all), sources, "applyFilter('搜索范围')"),
    QYD.explore.web(t.qttoken ? '账户中心' : '登录 / 账户', server + (t.qttoken ? '/user' : LOGIN_PATH), 1),
  ];
  if (!platform) {
    entries.push(QYD.explore.title('后端没有提供' + tab + '的平台'));
    return JSON.stringify(entries);
  }
  const j = await backendGet(server + '/discovestyle?source=' + enc(platform) + '&source_type=' + enc(gender) + '&tab=' + enc(tab), null);
  const list = unwrap(j);
  if (Array.isArray(list)) {
    if (j.msg) flutterBridge.showToast(String(j.msg));
    for (const it of list) {
      if (!it || !it.title) continue;
      const half = it.style && it.style.layout_flexBasisPercent === 0.45;
      const url = String(it.url || '');
      if (url) entries.push(QYD.explore.list(purify(it.title), url, half ? 1 : Number(it.width) || 0));
      else entries.push(QYD.explore.title(purify(it.title)));
    }
  } else {
    entries.push(QYD.explore.title('发现页获取失败' + (j && j.msg ? '：' + j.msg : '')));
  }
  return JSON.stringify(entries);
}

async function find(url, page) {
  const server = await getServer();
  url = String(url || '').replace('{{page}}', String(Number(page) || 1));
  const j = await backendGet(url, 0);
  if (!j) {
    flutterBridge.log('发现失败：' + url);
    return '[]';
  }
  if (j.code !== undefined && j.code !== 0 && j.msg) {
    flutterBridge.showToast(String(j.msg));
    return '[]';
  }
  return JSON.stringify(toBooks(server, j));
}

/** Browsing in the app's web view: a 维基文库 work page becomes a book of this source. */
async function shouldOverrideUrlLoading(url) {
  url = String(url || '');
  const m = url.match(/^https?:\/\/zh\.wikisource\.org\/wiki\/([^?#]+)/);
  if (!m) return true;
  let title = '';
  try {
    title = decodeURIComponent(m[1]).replace(/_/g, ' ').split('/')[0];
  } catch (e) {
    return true;
  }
  if (!title || title.indexOf(':') >= 0) return true;
  const server = await getServer();
  const target = server + '/detail?book_id=' + b64e(title).replace(/=+$/, '').replace(/\+/g, '-').replace(/\//g, '_') + '&source=' + enc('维基文库') + '&tab=' + enc('小说');
  flutterBridge.showToast('添加书籍到书架：' + title);
  flutterBridge.addbook(target);
  return false;
}
